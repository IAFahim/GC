name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact_name: gc-linux-x64
            asset_name: gc-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact_name: gc-linux-arm64
            asset_name: gc-linux-arm64.tar.gz
          - os: windows-latest
            target: win-x64
            artifact_name: gc-windows-x64
            asset_name: gc-windows-x64.zip
          - os: macos-latest
            target: osx-x64
            artifact_name: gc-macos-x64
            asset_name: gc-macos-x64.tar.gz
          - os: macos-latest
            target: osx-arm64
            artifact_name: gc-macos-arm64
            asset_name: gc-macos-arm64.tar.gz

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore gc.sln

    - name: Build
      run: dotnet build gc.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test tests/gc.Tests/gc.Tests.csproj --configuration Release --no-restore --verbosity normal --filter "FullyQualifiedName!~ReleaseBinary"

    - name: Publish ${{ matrix.target }}
      shell: bash
      run: |
        release_version="${GITHUB_REF_NAME#v}"
        dotnet publish src/gc.CLI/gc.CLI.csproj -c Release -r ${{ matrix.target }} --self-contained -p:PublishAot=true -p:Version="$release_version" -o ./publish/${{ matrix.target }}

    - name: Smoke test ${{ matrix.target }}
      if: matrix.target == 'linux-x64' || matrix.target == 'linux-arm64' || matrix.target == 'win-x64' || matrix.target == 'osx-arm64'
      shell: bash
      run: |
        release_version="${GITHUB_REF_NAME#v}"
        if [ "$RUNNER_OS" = Windows ]; then
          bin="publish/${{ matrix.target }}/gc.exe"
          python scripts/smoke-context.py "$bin"
        else
          bin="publish/${{ matrix.target }}/gc"
          python3 scripts/smoke-context.py "$bin"
        fi
        "$bin" --version | grep -F "gc version $release_version"
        "$bin" --help | grep -F -- "-u, --unity"

    - name: Create Archive (Unix)
      if: runner.os != 'Windows'
      run: |
        cd publish/${{ matrix.target }}
        tar -czf ../../${{ matrix.asset_name }} .

    - name: Create Archive (Windows)
      if: runner.os == 'Windows'
      run: |
        Compress-Archive -Path publish/${{ matrix.target }}/* -DestinationPath ${{ matrix.asset_name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Generate Checksums
      run: |
        cd artifacts
        sha256sum * > ../checksums.txt

    - name: Upload Release Asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" artifacts/* checksums.txt \
          --repo "${{ github.repository }}" \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes
